<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏡 Nearby Neighbor Login - SafeReach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at center, rgba(52, 199, 89, 0.15), rgba(15, 23, 42, 1));
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      border: 1px solid rgba(52, 199, 89, 0.3);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dark-muted);
      margin-bottom: 0.4rem;
    }
    .form-control {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--dark-border);
      border-radius: var(--radius-md);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }
    .form-control:focus {
      border-color: var(--success);
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="glass-card auth-card">
      <div style="text-align:center; margin-bottom: 2rem;">
        <a href="/" class="brand-logo" style="justify-content:center; margin-bottom:0.75rem;">
          <div class="logo-icon" style="background:#34c759;">🏡</div>
          <span>SafeReach</span>
        </a>
        <h2 style="font-size:1.5rem; color:#fff; font-weight:800;">Nearby Neighbor Sign In</h2>
        <p style="font-size:0.88rem; color:var(--dark-muted);">Receive immediate tier-1 emergency broadcasts in your block</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" value="neighbor@safereach.com" placeholder="neighbor@safereach.com" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" value="password123" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-success" style="width:100%; padding:0.9rem; margin-top:0.5rem; font-weight:700;">
          🏡 Sign In as Community Neighbor
        </button>
      </form>

      <div style="margin-top:1.5rem; text-align:center;">
        <button type="button" onclick="quickDemoLogin('neighbor@safereach.com')" class="btn btn-secondary btn-sm" style="width:100%;">
          ⚡ 1-Click Auto Fill Demo Credentials
        </button>
      </div>

      <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--dark-muted); display:flex; justify-content:space-between;">
        <a href="/login" style="color:var(--dark-muted);">← All Role Logins</a>
        <a href="/register" style="font-weight:600;">Register New Account</a>
      </div>
    </div>
  </div>

  <script src="/public/js/app.js"></script>
  <script src="/public/js/auth.js"></script>
</body>
</html>
