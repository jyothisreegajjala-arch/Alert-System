<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – SafeReach Emergency System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/style.css">
  <link rel="stylesheet" href="/public/css/accessibility.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: var(--bg-primary);
      transition: background-color 0.25s ease;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
    }
    .top-lang-bar {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      width: 100%;
      max-width: 480px;
    }
    .demo-role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.75rem;
    }
    @media (max-width: 480px) {
      .auth-card { padding: 1.25rem; }
      .demo-role-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="top-lang-bar">
      <a href="/" class="btn btn-secondary btn-sm">🏠 <span>Home</span></a>
      <div id="login-language-selector-container"></div>
      <button type="button" onclick="toggleThemeMode()" class="btn btn-secondary btn-sm" aria-label="Toggle Theme">
        <span id="theme-toggle-icon">🌙</span>
      </button>
      <button id="btn-toggle-accessibility" onclick="CareConnectAccessibility.toggle()" class="btn btn-secondary btn-sm" data-i18n="accessibility_mode">
        👁️ Accessibility
      </button>
    </div>

    <div class="neo-card auth-card">
      <div style="text-align:center; margin-bottom: 1.75rem;">
        <a href="/" class="brand-logo" style="justify-content:center; margin-bottom:0.75rem;">
          <div class="logo-icon">🆘</div>
          <span>SafeReach</span>
        </a>
        <h2 style="font-size:1.6rem; color:var(--text-primary); font-weight:800;" data-i18n="welcome">Welcome Back</h2>
        <p style="font-size:0.9rem; color:var(--text-muted);" data-i18n="app_tagline">Sign in to access your community emergency console</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.45rem;">
            <label for="login-password" style="margin-bottom:0;">Password</label>
            <a href="#" onclick="alert('Demo reset instructions sent to your email address.')" style="font-size:0.82rem; font-weight:600;">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;" data-i18n="login">Sign In</button>
      </form>

      <!-- Dedicated Role Login Portals -->
      <div class="neo-card-inset" style="margin-top:1.5rem;">
        <p style="font-size:0.82rem; font-weight:700; color:var(--accent-amber); text-transform:uppercase; letter-spacing:0.5px; text-align:center;">
          🔑 Direct Role Login Portals
        </p>
        <div class="demo-role-grid">
          <a href="/login/senior" class="btn btn-secondary btn-sm" style="text-align:center;"><span data-i18n="senior_citizen">👵 Senior Citizen</span></a>
          <a href="/login/family" class="btn btn-secondary btn-sm" style="text-align:center;"><span data-i18n="guardian">👨‍👩‍👧 Family Member</span></a>
          <a href="/login/child" class="btn btn-secondary btn-sm" style="text-align:center;"><span>👶 </span><span data-i18n="child_dependent">Child / Dependent</span></a>
          <a href="/login/neighbor" class="btn btn-secondary btn-sm" style="text-align:center;"><span data-i18n="neighbor">🏡 Neighbor</span></a>
          <a href="/login/security" class="btn btn-secondary btn-sm" style="text-align:center;"><span data-i18n="security">👮 Security Guard</span></a>
          <a href="/login/volunteer" class="btn btn-secondary btn-sm" style="text-align:center;"><span data-i18n="volunteer">🤝 Volunteer</span></a>
          <a href="/login/admin" class="btn btn-danger btn-sm" style="text-align:center; grid-column:span 2;"><span data-i18n="admin">👑 System Admin Console</span></a>
        </div>
      </div>

      <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted);">
        Don't have an account? <a href="/register" style="font-weight:700;" data-i18n="register">Register Here</a>
      </div>
    </div>
  </div>

  <script src="/public/js/i18n.js"></script>
  <script src="/public/js/voiceAssistant.js"></script>
  <script src="/public/js/accessibility.js"></script>
  <script src="/public/js/app.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/fcm.js"></script>
  <script>
    function toggleThemeMode() {
      const isLight = document.body.classList.toggle('light-theme');
      const icon = document.getElementById('theme-toggle-icon');
      if (icon) icon.textContent = isLight ? '☀️' : '🌙';
      try {
        localStorage.setItem('careconnect_theme', isLight ? 'light' : 'dark');
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        if (localStorage.getItem('careconnect_theme') === 'light') {
          document.body.classList.add('light-theme');
          const icon = document.getElementById('theme-toggle-icon');
          if (icon) icon.textContent = '☀️';
        }
      } catch (e) {}

      if (window.CareConnectI18n) {
        CareConnectI18n.renderLanguageSelector('login-language-selector-container');
      }
    });
  </script>
</body>
</html>
