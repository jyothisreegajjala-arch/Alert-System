<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account – SafeReach Emergency System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/style.css?v=3.0.0">
  <link rel="stylesheet" href="/public/css/accessibility.css?v=3.0.0">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: var(--bg-canvas);
    }
    .auth-card {
      width: 100%;
      max-width: 580px;
    }
    .top-lang-bar {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      width: 100%;
      max-width: 580px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 540px) {
      .auth-card { padding: 1.25rem; }
      .auth-wrapper { padding: 1.5rem 0.75rem; }
      .grid-2 { grid-template-columns: 1fr; gap: 0; }
    }
    .role-specific-field {
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper" style="background:#eaf2f8; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5rem 1rem;">
    
    <div class="auth-card" style="background:#ffffff; border-radius:24px; padding:2rem 1.75rem; box-shadow:0 8px 30px rgba(0,0,0,0.06); max-width:460px; width:100%; border:1px solid #e2e8f0;">
      
      <!-- Brand Header -->
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div style="display:inline-flex; align-items:center; gap:0.45rem; justify-content:center; margin-bottom:0.75rem;">
          <span style="background:#e11d48; color:#fff; font-size:0.8rem; font-weight:900; padding:0.25rem 0.45rem; border-radius:6px;">SOS</span>
          <span style="font-size:1.35rem; font-weight:800; color:#1e293b;">SafeReach</span>
        </div>
        <h2 style="font-size:1.6rem; color:#0f172a; font-weight:900; margin-bottom:0.35rem;">Create Account</h2>
        <p style="font-size:0.88rem; color:#64748b; font-weight:600; line-height:1.4;">Register your community role to participate in the safety network</p>
      </div>

      <form id="register-form">
        <div class="form-group" style="margin-bottom:1.1rem;">
          <label for="reg-name" style="display:block; font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0.4rem;">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Jane Doe" required style="width:100%; padding:0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a;">
        </div>

        <div class="form-group" style="margin-bottom:1.1rem;">
          <label for="reg-phone" style="display:block; font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0.4rem;">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000" required style="width:100%; padding:0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a;">
        </div>

        <div class="form-group" style="margin-bottom:1.1rem;">
          <label for="reg-email" style="display:block; font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0.4rem;">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="jane@example.com" required style="width:100%; padding:0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a;">
        </div>

        <div class="form-group" style="margin-bottom:1.1rem;">
          <label for="reg-role" style="display:block; font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0.4rem;">User Role</label>
          <select id="reg-role" class="form-control" style="width:100%; padding:0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a; font-weight:600; cursor:pointer;" required>
            <option value="senior_citizen">👵 Senior Citizen (SOS User)</option>
            <option value="child">👶 Child / Dependent (SOS User)</option>
            <option value="family_member">👥 Family Member</option>
            <option value="neighbor">🏡 Nearby Neighbor (Tier 1 Responder)</option>
            <option value="security_guard">👮 Security Guard (Tier 1 Responder)</option>
            <option value="volunteer">🤝 Registered Volunteer (Tier 2 Escalation)</option>
            <option value="admin">👑 System Administrator (Full System Control)</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom:1.1rem;">
          <label for="reg-address" style="display:block; font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0.4rem;">Street / Building Address</label>
          <input type="text" id="reg-address" class="form-control" placeholder="Sunrise Heights Block A" required style="width:100%; padding:0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a;">
        </div>

        <div class="form-group" style="margin-bottom:1.1rem;">
          <label for="reg-medical" style="display:block; font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0.4rem;">Medical Notes &amp; Pre-existing Conditions (Optional)</label>
          <input type="text" id="reg-medical" class="form-control" placeholder="e.g. Asthma, Pacemaker, Mobil" style="width:100%; padding:0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a;">
        </div>

        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="reg-password" style="display:block; font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0.4rem;">Password</label>
          <div style="position:relative;">
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required style="width:100%; padding:0.75rem 2.5rem 0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a;">
            <button type="button" onclick="const p = document.getElementById('reg-password'); p.type = p.type === 'password' ? 'text' : 'password';" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1rem; opacity:0.6;">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn" style="width:100%; padding:0.8rem; background:#e0edf7; color:#0369a1; font-weight:800; font-size:1rem; border-radius:12px; border:1px solid #bae6fd; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.03);">Create Account</button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:#64748b; font-weight:600;">
        Already have an account? <a href="/login" style="color:#0284c7; font-weight:800; text-decoration:none;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/public/js/i18n.js"></script>
  <script src="/public/js/app.js?v=3.0.0"></script>
  <script src="/public/js/auth.js?v=3.0.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.CareConnectI18n) {
        CareConnectI18n.renderLanguageSelector('register-language-selector-container');
      }
    });
  </script>
</body>
</html>
