<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – SafeReach Emergency System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/style.css?v=3.0.0">
  <link rel="stylesheet" href="/public/css/accessibility.css?v=3.0.0">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: var(--bg-canvas);
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
    }
    .top-lang-bar {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      width: 100%;
      max-width: 480px;
    }
    .demo-role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.75rem;
    }
    @media (max-width: 480px) {
      .auth-card { padding: 1.25rem; }
      .demo-role-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="auth-wrapper" style="background:#eaf2f8; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5rem 1rem;">
    
    <div class="auth-card" style="background:#ffffff; border-radius:24px; padding:2rem 1.75rem; box-shadow:0 8px 30px rgba(0,0,0,0.06); max-width:440px; width:100%; border:1px solid #e2e8f0;">
      
      <!-- Brand Header -->
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div style="display:inline-flex; align-items:center; gap:0.45rem; justify-content:center; margin-bottom:0.75rem;">
          <span style="background:#e11d48; color:#fff; font-size:0.8rem; font-weight:900; padding:0.25rem 0.45rem; border-radius:6px;">SOS</span>
          <span style="font-size:1.35rem; font-weight:800; color:#1e293b;">CareConnect</span>
        </div>
        <h2 style="font-size:1.6rem; color:#0f172a; font-weight:900; margin-bottom:0.35rem;">Welcome to CareConnect</h2>
        <p style="font-size:0.9rem; color:#64748b; font-weight:600;">Smart Community Emergency &amp; Care System</p>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom:1.15rem;">
          <label for="login-email" style="display:block; font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0.45rem;">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required style="width:100%; padding:0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a;">
        </div>

        <div class="form-group" style="margin-bottom:1.25rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.45rem;">
            <label for="login-password" style="font-size:0.88rem; font-weight:700; color:#1e293b; margin-bottom:0;">Password</label>
            <a href="#" onclick="alert('Demo reset link sent to your email.')" style="font-size:0.82rem; font-weight:700; color:#0284c7; text-decoration:none;">Forgot?</a>
          </div>
          <div style="position:relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required style="width:100%; padding:0.75rem 2.5rem 0.75rem 1rem; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; font-size:0.95rem; color:#0f172a;">
            <button type="button" onclick="const p = document.getElementById('login-password'); p.type = p.type === 'password' ? 'text' : 'password';" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1rem; opacity:0.6;">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn" style="width:100%; padding:0.8rem; background:#e0edf7; color:#0369a1; font-weight:800; font-size:1rem; border-radius:12px; border:1px solid #bae6fd; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.03);" data-i18n="login">Login</button>
      </form>

      <!-- Dedicated Role Login Portals (Exact Replica of Screenshot 2) -->
      <div style="margin-top:1.5rem; text-align:center;">
        <p style="font-size:0.8rem; font-weight:800; color:#ea580c; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.75rem;">
          🔑 SELECT DEDICATED ROLE LOGIN PORTAL
        </p>
        <div style="display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center;">
          <a href="/login/senior" class="btn btn-sm" style="background:#e0edf7; color:#0369a1; font-weight:700; border-radius:10px; padding:0.45rem 0.85rem; border:1px solid #bae6fd; text-decoration:none;">Senior Citizen</a>
          <a href="/login/family" class="btn btn-sm" style="background:#e0edf7; color:#0369a1; font-weight:700; border-radius:10px; padding:0.45rem 0.85rem; border:1px solid #bae6fd; text-decoration:none;">Guardian / Family</a>
          <a href="/login/child" class="btn btn-sm" style="background:#e0edf7; color:#0369a1; font-weight:700; border-radius:10px; padding:0.45rem 0.85rem; border:1px solid #bae6fd; text-decoration:none;">👶 Child / Dependent</a>
          <a href="/login/neighbor" class="btn btn-sm" style="background:#e0edf7; color:#0369a1; font-weight:700; border-radius:10px; padding:0.45rem 0.85rem; border:1px solid #bae6fd; text-decoration:none;">Nearby Neighbor</a>
          <a href="/login/security" class="btn btn-sm" style="background:#e0edf7; color:#0369a1; font-weight:700; border-radius:10px; padding:0.45rem 0.85rem; border:1px solid #bae6fd; text-decoration:none;">Security Guard</a>
          <a href="/login/volunteer" class="btn btn-sm" style="background:#e0edf7; color:#0369a1; font-weight:700; border-radius:10px; padding:0.45rem 0.85rem; border:1px solid #bae6fd; text-decoration:none;">Volunteer</a>
          <a href="/login/admin" class="btn btn-sm" style="background:#e0edf7; color:#0369a1; font-weight:700; border-radius:10px; padding:0.45rem 0.85rem; border:1px solid #bae6fd; text-decoration:none;">System Admin</a>
        </div>
      </div>

      <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:#64748b; font-weight:600;">
        Don't have an account? <a href="/register" style="color:#0284c7; font-weight:800; text-decoration:none;">Register</a>
      </div>
    </div>
  </div>

  <script src="/public/js/i18n.js"></script>
  <script src="/public/js/voiceAssistant.js"></script>
  <script src="/public/js/accessibility.js"></script>
  <script src="/public/js/app.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/fcm.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.CareConnectI18n) {
        CareConnectI18n.renderLanguageSelector('login-language-selector-container');
      }
    });
  </script>
</body>
</html>
